		</linearGradient>
		</defs>
		<path id="backEdge2" d="M227.6 185.5L128.0 128.0" stroke="#2E2E2E" stroke-opacity="1.000000" stroke-width="6.000000" stroke-linecap="round" fill="none"/>
		<path id="backEdge0" d="M28.4 185.5L128.0 128.0" stroke="#2E2E2E" stroke-opacity="1.000000" stroke-width="6.000000" stroke-linecap="round" fill="none"/>
