		<path id="bodyFill" d="M28.4 70.5L128.0 13.0L227.6 70.5L227.6 185.5L128.0 243.0L28.4 185.5Z" fill="url(#sheetifyGrad)" fill-opacity="0.75"/>
		<path id="bodyOutline" d="M28.4 70.5L128.0 13.0L227.6 70.5L227.6 185.5L128.0 243.0L28.4 185.5Z" stroke="#2E2E2E" stroke-opacity="1.000000" stroke-width="6.000000" stroke-linejoin="round" fill="none"/>
		<path id="edge0" d="M28.4 185.5L128.0 243.0" stroke="#2E2E2E" stroke-opacity="1.000000" stroke-width="6.000000" stroke-linecap="round" fill="none"/>
