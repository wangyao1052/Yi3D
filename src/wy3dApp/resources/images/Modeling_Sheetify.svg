<?xml version="1.0" encoding="UTF-8"?>
<svg width="256.000000" height="256.000000" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
	<desc>Sheetify</desc>
	<g id="body">
		<!-- 片体化:和实体化同一个立方体(同坐标)、同一条面渐变,只是面带半透明 —— 面无厚度、能看见背后 -->
